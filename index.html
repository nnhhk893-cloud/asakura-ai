<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朝倉文夫＆キュレーターAIガイド</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      background-color: #16181d;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
    }
    .screen-container {
      max-width: 820px;
      width: 100%;
      background: #1f232d;
      border: 1px solid #2d3343;
      padding: 48px 40px;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    #intro-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* 【修正】縦長動画（9:16）が途切れず全体が綺麗に収まるよう調整 */
    .intro-video {
      width: 100%;
      max-width: 340px;
      height: auto;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 3px solid #4a5568;
      background-color: #000;
      margin-bottom: 24px;
    }
    .skip-button {
      padding: 12px 32px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      color: #a0aec0;
      background: transparent;
      border: 1px solid #4a5568;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .skip-button:hover {
      color: #ffffff;
      border-color: #cbd5e0;
      background-color: rgba(255, 255, 255, 0.05);
    }
    #lp-screen {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .subtitle {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #a0aec0;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 28px;
      font-weight: normal;
      letter-spacing: 0.08em;
      color: #ffffff;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .avatar-container {
      display: flex;
      justify-content: center;
      gap: 56px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border: 4px solid #4a5568;
      background-color: #2d3748;
    }
    .avatar-name {
      margin-top: 14px;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #f7fafc;
    }
    .description {
      font-size: 16px;
      line-height: 2.0;
      color: #cbd5e0;
      margin: 0 auto 40px auto;
      max-width: 620px;
    }
    .chat-button {
      display: inline-block;
      padding: 18px 48px;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #1a202c;
      background-color: #e2e8f0;
      border-radius: 40px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .chat-button:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="screen-container">
    
    <!-- 導入動画画面 -->
    <div id="intro-screen">
      <video id="introVideo" class="intro-video" src="intro.mp4" autoplay muted playsinline>
        お使いのブラウザは動画再生に対応していません。
      </video>
      <div>
        <button class="skip-button" onclick="showLpScreen()">館内へ進む ➔</button>
      </div>
    </div>

    <!-- メインLP画面 -->
    <div id="lp-screen">
      <div class="subtitle">Asakura Fumio Memorial Museum</div>
      <h1>朝倉文夫＆キュレーターAIガイド</h1>
      
      <div class="avatar-container">
        <div class="avatar-box">
          <img src="asakura.png" alt="朝倉文夫先生" class="avatar">
          <span class="avatar-name">朝倉 文夫</span>
        </div>
        <div class="avatar-box">
          <img src="asuka.png" alt="キュレーター アスカ" class="avatar">
          <span class="avatar-name">キュレーター アスカ</span>
        </div>
      </div>

      <p class="description">
        彫刻家・朝倉文夫の生涯や作品、そして自然主義の哲学について、AIガイドが丁寧にお答えします。<br>
        下のボタンを押して、対話ルームへお進みください。
      </p>
      
      <button onclick="window.open('https://www.coze.com/space/7706094358847963189/bot/7706099504453828661', '_blank')" class="chat-button">
        💬 朝倉文夫＆キュレーターAIと対話する
      </button>
    </div>

  </div>

  <script>
    const video = document.getElementById('introVideo');
    const introScreen = document.getElementById('intro-screen');
    const lpScreen = document.getElementById('lp-screen');

    function showLpScreen() {
      introScreen.style.display = 'none';
      lpScreen.style.display = 'block';
    }

    // 動画が終了したらLPへ切り替え
    video.addEventListener('ended', function() {
      showLpScreen();
    });

    video.addEventListener('error', function() {
      console.log('動画読み込みエラー、スキップボタンを利用できます');
    });
  </script>

</body>
</html>
